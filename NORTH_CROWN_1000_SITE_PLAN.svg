<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="820" viewBox="0 0 1000 760">
  <defs>
    <style>
      text { font-family: Arial, sans-serif; fill: #253039; }
      .small { font-size: 12px; }
      .label { font-size: 15px; font-weight: 700; }
      .road { stroke: #565e63; fill: none; stroke-linecap: round; }
      .local { stroke: #899297; fill: none; stroke-width: 5; }
    </style>
    <pattern id="houses" width="18" height="18" patternUnits="userSpaceOnUse">
      <rect x="3" y="3" width="10" height="8" rx="1" fill="#e4bda9"/>
    </pattern>
  </defs>
  <rect width="1000" height="760" fill="#eef2ed"/>
  <text x="28" y="32" font-size="24" font-weight="700">North Crown — 1,000-home site plan</text>
  <text x="28" y="53" class="small">Review proposal · Blender x east/west · Blender y increases north/up</text>

  <!-- Existing adjoining city -->
  <rect x="27" y="445" width="469" height="262" rx="6" fill="#d7c7aa" stroke="#7f725e" stroke-width="2"/>
  <text x="48" y="680" class="label">Existing / reserved West Quarter</text>
  <rect x="432" y="446" width="365" height="209" rx="6" fill="#b8c7d0" stroke="#536b79" stroke-width="2"/>
  <text x="512" y="620" class="label">Planned Crown Quarter downtown</text>

  <!-- New contiguous planning envelope -->
  <rect x="27" y="87" width="765" height="358" rx="5" fill="url(#houses)" stroke="#395d4d" stroke-width="3"/>
  <text x="42" y="112" class="label">North Crown starts on the existing y=826 edge — no gap</text>

  <!-- Neighborhood bands -->
  <path d="M201 87V445 M433 87V445 M601 87V445 M713 87V445" stroke="#91a99d" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="62" y="142" class="small">Harrow North</text>
  <text x="270" y="142" class="small">Forge Park</text>
  <text x="465" y="142" class="small">Crown Gardens</text>
  <text x="615" y="142" class="small">Maple North</text>
  <text x="716" y="142" class="small">Anvil Meadows</text>

  <!-- Parkway -->
  <path d="M27 381H862" class="road" stroke-width="18"/>
  <path d="M27 381H862" stroke="#92a96e" stroke-width="4" stroke-dasharray="13 8"/>
  <rect x="430" y="343" width="350" height="26" rx="4" fill="#eef2ed" opacity=".94"/>
  <text x="605" y="362" class="label" text-anchor="middle">North Crown Parkway · 4 lanes + median · y=930</text>

  <!-- Selected collectors and local loops -->
  <path d="M96 445V381 Q96 315 145 284 Q190 250 145 205 Q96 168 96 87" class="local"/>
  <path d="M208 445V381 Q250 330 230 275 Q210 220 255 180 Q300 140 280 87" class="local"/>
  <path d="M320 445V381 M432 445V381 M544 446V87 M656 446V87 M768 446V87" class="local"/>
  <path d="M42 298H188 M448 300H585 M594 230H705 M610 160H785" class="local"/>
  <path d="M450 420 Q500 400 544 420 M656 420 Q710 400 768 420" class="local"/>

  <!-- Signals -->
  <g fill="#f5c84b" stroke="#5c4d1e">
    <circle cx="96" cy="381" r="6"/><circle cx="208" cy="381" r="6"/>
    <circle cx="320" cy="381" r="6"/><circle cx="432" cy="381" r="6"/>
    <circle cx="544" cy="381" r="6"/><circle cx="656" cy="381" r="6"/>
    <circle cx="768" cy="381" r="6"/>
  </g>

  <!-- Apartment campus -->
  <rect x="265" y="207" width="160" height="160" rx="6" fill="#c5b9d4" stroke="#5f4774" stroke-width="3"/>
  <text x="345" y="226" class="label" text-anchor="middle">20-building gated campus</text>
  <path d="M345 367V337 Q345 320 320 305 Q295 290 295 260 H395 Q395 305 370 320 Q345 335 345 350" fill="none" stroke="#6c6574" stroke-width="8"/>
  <rect x="326" y="276" width="38" height="22" rx="8" fill="#5fb8ce" stroke="#287188" stroke-width="2"/>
  <text x="345" y="271" class="small" text-anchor="middle">pool court</text>
  <circle cx="345" cy="365" r="6" fill="#d9b34b" stroke="#5c4d1e"/>
  <text x="355" y="344" class="small">main gate</text>

  <!-- Expressway and river -->
  <path d="M818 730V50" class="road" stroke-width="24"/>
  <path d="M812 730V50 M824 730V50" stroke="#f0e8c8" stroke-width="2" stroke-dasharray="12 10"/>
  <text x="842" y="105" class="label" transform="rotate(90 842 105)">Crown Expressway · x=222</text>
  <path d="M818 330 C790 337 790 365 768 381 M818 432 C790 425 790 397 768 381" fill="none" stroke="#565e63" stroke-width="7"/>
  <path d="M818 330 C846 337 846 365 862 381 M818 432 C846 425 846 397 862 381" fill="none" stroke="#565e63" stroke-width="7"/>
  <rect x="805" y="292" width="115" height="21" rx="3" fill="#eef2ed" opacity=".94"/>
  <text x="862" y="307" class="small" text-anchor="middle">new diamond exit</text>
  <path d="M930 730 C910 650 945 570 925 490 C905 410 942 330 922 250 C905 180 940 115 928 50" fill="none" stroke="#4a9bc0" stroke-width="22" opacity=".7"/>
  <text x="950" y="185" class="label" transform="rotate(90 950 185)">river / riparian corridor</text>

  <!-- Coordinate notes and legend -->
  <text x="26" y="731" class="small">South edge y=826</text>
  <text x="26" y="78" class="small">North edge y=1,404</text>
  <rect x="510" y="695" width="462" height="48" rx="5" fill="#ffffff" stroke="#b2bbb4"/>
  <rect x="525" y="709" width="22" height="14" fill="url(#houses)" stroke="#395d4d"/>
  <text x="553" y="721" class="small">new homes</text>
  <rect x="640" y="709" width="22" height="14" fill="#c5b9d4" stroke="#5f4774"/>
  <text x="668" y="721" class="small">apartments</text>
  <circle cx="770" cy="716" r="6" fill="#f5c84b" stroke="#5c4d1e"/>
  <text x="782" y="721" class="small">signal</text>
  <path d="M865 716H900" stroke="#565e63" stroke-width="9"/>
  <text x="908" y="721" class="small">major road</text>
</svg>
