# Safety net for the town export. Twice now (most recently 2026-07-08) a
# mid-animation Blender export shipped a "pancaked" town.glb -- houses baked
# with a near-zero scale on one axis -- and it sat on the live site unnoticed.
# Vercel deploys straight from main, so this check runs on every push to main
# and turns red if town.glb is broken, empty, or out of sync with
# world_state.json. Move this file to .github/workflows/ in the repo.

name: Check Followville

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pygltflib
        run: pip install pygltflib

      - name: Validate town.glb against world_state.json
        run: python check_town_glb.py town.glb world_state.json

      - name: Validate the 366-house suburban reserve
        run: python neighborhood_plan.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install browser test dependencies
        run: pnpm install --frozen-lockfile

      # Chromium was downloaded from scratch on every run. It only changes
      # when the Playwright version does, so key the cache on the lockfile.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run public experience regression checks
        run: pnpm test:e2e

      # The config already records a trace and video on failure, but nothing
      # collected them, so every red run discarded the one artefact that shows
      # what actually happened. Six attempts were spent guessing at a failure
      # a trace would have settled in one.
      - name: Upload Playwright trace and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn
