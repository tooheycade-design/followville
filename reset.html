<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Followville — Reset your password</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
<style>
  :root{
    --cream:#f2e9da; --navy:#1c2b45; --navy-soft:#2c3f5e;
    --accent:#c96b4a; --accent-soft:#e9a484; --green:#4f8e67;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; min-height:100%; }
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:var(--navy); color:#fff; min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom));
  }
  .card{
    width:100%; max-width:390px; background:var(--cream); color:var(--navy);
    border-radius:16px; padding:30px 26px 26px; box-shadow:0 26px 60px rgba(4,12,22,.5);
  }
  .kicker{
    font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase;
    color:var(--accent);
  }
  h1{ margin:7px 0 8px; font:400 27px/1.15 Georgia,"Times New Roman",serif; }
  p{ margin:0 0 4px; font-size:13.5px; line-height:1.55; opacity:.76; }
  label{
    display:block; margin:16px 0 5px; font-size:11px; letter-spacing:.07em;
    text-transform:uppercase; opacity:.6;
  }
  input{
    width:100%; font:inherit; font-size:16px; padding:11px 12px; border-radius:9px;
    background:#fff; color:var(--navy); border:1px solid rgba(28,43,69,.22);
  }
  input:focus{ outline:2px solid rgba(201,107,74,.5); outline-offset:1px; }
  button.primary{
    width:100%; margin-top:20px; padding:12px; border:0; border-radius:9px; cursor:pointer;
    font:inherit; font-size:15px; font-weight:600; background:var(--accent); color:#fff;
  }
  button.primary:disabled{ opacity:.55; cursor:default; }
  button.linkish{
    display:block; width:100%; margin-top:13px; padding:0; border:0; background:none;
    cursor:pointer; font:inherit; font-size:12.5px; color:var(--navy); opacity:.66;
    text-decoration:underline;
  }
  .err{ margin-top:11px; font-size:12.5px; line-height:1.5; color:#a8321d; }
  .ok{
    margin-top:14px; padding:12px 13px; border-radius:9px; font-size:13px; line-height:1.5;
    background:rgba(79,142,103,.14); border:1px solid rgba(79,142,103,.4); color:#245c39;
  }
  .rule{ margin:18px 0 0; height:1px; background:rgba(28,43,69,.16); border:0; }
  .foot{ margin-top:14px; font-size:12px; opacity:.6; text-align:center; }
  .foot a{ color:var(--navy); }
  .hint{ margin-top:9px; font-size:12px; opacity:.6; }
</style>
</head>
<body>
<div class="card">
  <div class="kicker">Followville</div>
  <h1 id="title">Reset your password</h1>
  <div id="view"><p>Checking your link…</p></div>
</div>

<script type="module">
  const SUPABASE_URL = "https://bposhxtidoyulallvhdp.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJwb3NoeHRpZG95dWxhbGx2aGRwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MDgwMzUsImV4cCI6MjA5OTE4NDAzNX0._WRwlwtwLBrJIsvYjK5tj6XxDB98k5c6GB1HJ7WfSXk";

  const view = document.getElementById("view");
  const title = document.getElementById("title");
  const esc = s => String(s).replace(/[&<>"']/g,
    c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

  let sb = null;
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm");
    sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    title.textContent = "Something went wrong";
    view.innerHTML = `<p>We couldn't load the account system. Check your connection
      and reload this page.</p>`;
    throw e;
  }

  /* Supabase has shipped three different shapes of recovery link over the
     years and which one you get depends on project settings, not on us. All
     three are handled here, because a reset flow that works for most people
     is the same as one that is broken:
       1. #access_token=...&type=recovery      (implicit, auto-detected)
       2. ?code=...                            (PKCE)
       3. ?token_hash=...&type=recovery        (newer verify links)
     If none apply we fall through to asking for an email, so this page is
     also useful when someone just navigates to /reset directly. */
  async function establishSession(){
    const url = new URL(location.href);
    const hash = new URLSearchParams(location.hash.replace(/^#/, ""));

    if (hash.get("error_description")) {
      return { ok:false, message: hash.get("error_description") };
    }

    // The link is checked BEFORE any session already stored on this device.
    // Otherwise someone signed in as themselves who follows a reset link sent
    // to a different account would sail past this check and change their OWN
    // password, leaving the account they were trying to recover untouched.
    const code = url.searchParams.get("code");
    if (code) {
      const { error } = await sb.auth.exchangeCodeForSession(code);
      return error ? { ok:false, message:error.message } : { ok:true };
    }
    const tokenHash = url.searchParams.get("token_hash") || url.searchParams.get("token");
    if (tokenHash) {
      const { error } = await sb.auth.verifyOtp({
        token_hash: tokenHash, type: url.searchParams.get("type") || "recovery" });
      return error ? { ok:false, message:error.message } : { ok:true };
    }
    // Implicit links carry the tokens in the fragment and supabase-js consumes
    // them itself while the client is constructed, so the session is already
    // in place by the time we look.
    if (hash.get("access_token")) {
      const { data } = await sb.auth.getSession();
      if (data?.session) return { ok:true };
      return { ok:false, message:"that link could not be read" };
    }
    // No link at all — ask for an email rather than quietly offering to change
    // the password of whoever happens to be signed in on this device.
    return { ok:false, message:null };
  }

  function renderRequest(prefill, note){
    title.textContent = "Forgot your password?";
    view.innerHTML = `
      <p>Type the email you signed up with and we'll send you a link to set a
      new password.</p>
      ${note ? `<div class="err">${esc(note)}</div>` : ""}
      <label for="email">email</label>
      <input id="email" type="email" autocomplete="email" value="${esc(prefill || "")}" />
      <button class="primary" id="send" type="button">Send reset link</button>
      <div class="err" id="err"></div>
      <p class="hint">It works with the email you originally signed up with, even
      if you never confirmed it. If nothing arrives in a couple of minutes,
      check your spam folder.</p>
      <hr class="rule">
      <p class="foot"><a href="index.html">back to Followville</a></p>`;
    const email = document.getElementById("email");
    const send = document.getElementById("send");
    const err = document.getElementById("err");
    const submit = async () => {
      const value = email.value.trim();
      if (!value) { err.textContent = "Enter your email address."; return; }
      send.disabled = true; err.textContent = "";
      const { error } = await sb.auth.resetPasswordForEmail(value, {
        redirectTo: location.origin + "/reset.html" });
      send.disabled = false;
      if (error) { err.textContent = error.message; return; }
      // Deliberately the same wording whether or not the address is on file:
      // saying "no such account" would let anyone test which emails exist.
      title.textContent = "Check your email";
      view.innerHTML = `
        <div class="ok">If <b>${esc(value)}</b> has a Followville account, a reset
        link is on its way. The link opens a page where you choose a new password.</div>
        <p class="hint">It can take a minute or two. Check spam if you don't see it.
        The link is single-use and expires after about an hour.</p>
        <hr class="rule">
        <p class="foot"><a href="index.html">back to Followville</a></p>`;
    };
    send.onclick = submit;
    email.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    email.focus();
  }

  function renderSetPassword(){
    title.textContent = "Choose a new password";
    view.innerHTML = `
      <p>You're signed in from your reset link. Pick a new password and you're done.</p>
      <label for="pw">new password</label>
      <input id="pw" type="password" autocomplete="new-password" />
      <label for="pw2">confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" />
      <button class="primary" id="save" type="button">Save new password</button>
      <div class="err" id="err"></div>
      <p class="hint">At least 8 characters.</p>`;
    const pw = document.getElementById("pw");
    const pw2 = document.getElementById("pw2");
    const save = document.getElementById("save");
    const err = document.getElementById("err");
    const submit = async () => {
      err.textContent = "";
      if (pw.value.length < 8) { err.textContent = "Use at least 8 characters."; return; }
      if (pw.value !== pw2.value) { err.textContent = "Those two don't match."; return; }
      save.disabled = true;
      const { error } = await sb.auth.updateUser({ password: pw.value });
      save.disabled = false;
      if (error) { err.textContent = error.message; return; }
      title.textContent = "You're all set";
      view.innerHTML = `
        <div class="ok">Your password is changed and you're signed in on this
        device. You'll stay signed in unless you sign out.</div>
        <hr class="rule">
        <p class="foot"><a href="index.html">go to Followville</a> &middot;
        <a href="vote.html">vote for mayor</a></p>`;
    };
    save.onclick = submit;
    [pw, pw2].forEach(i => i.addEventListener("keydown",
      e => { if (e.key === "Enter") submit(); }));
    pw.focus();
  }

  // A recovery session is a normal session, so if the link worked we can just
  // set the password. If it didn't, say so plainly and offer another link
  // rather than leaving someone staring at a dead page.
  const result = await establishSession();
  if (result.ok) {
    renderSetPassword();
  } else {
    // ?email= is passed through from the sign-in form so nobody retypes it.
    const prefill = new URL(location.href).searchParams.get("email") || "";
    renderRequest(prefill, result.message
      ? "That link didn't work — it may have expired or already been used. "
        + "Links last about an hour and work once. Send yourself a fresh one below."
      : null);
  }
</script>
</body>
</html>
